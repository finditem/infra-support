packages:
  - 'apps/**'
  - 'packages/**'
# 상위 패키지가 취약한 버전을 고정하고 있어 override로만 올릴 수 있는 transitive 의존성만 남긴다.
# 직접 의존성(next, react-router-dom 등)은 각 앱의 package.json에서 올리고 여기에 적지 않는다.
# 대상 버전에는 반드시 상한을 둔다. '>=x' 형태로 적으면 최신 메이저까지 끌어올려 의존성 트리가 깨진다.
overrides:
  '@babel/core@<7.29.6': '^7.29.6'
  brace-expansion@<1.1.17: '^1.1.17'
  brace-expansion@>=2.0.0 <2.1.3: '^2.1.3'
  esbuild@>=0.27.3 <0.28.1: '^0.28.1'
  expr-eval-fork@<=3.0.0: '^3.0.1'
  fast-uri@>=3.0.0 <3.1.4: '^3.1.4'
  js-yaml@>=4.0.0 <4.3.0: '^4.3.0'
  minimatch@>=9.0.0 <9.0.7: '^9.0.7'
  postcss@<8.5.18: '^8.5.18'
  qs@>=6.11.1 <6.15.2: '^6.15.2'
  sharp@<0.35.0: '^0.35.0'
  tmp@<0.2.6: '^0.2.6'
