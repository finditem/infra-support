name: PR Deadline Escalation

# D 라벨의 처리 기한이 지났는데 아직 승인이 없는 PR을 찾아 리뷰어를 호출한다.
# 기한이 지나도 머지 차단을 풀지 않는다. 알림만 보낸다.

on:
  schedule:
    # 매시 정각. 요일과 시간대를 가리지 않고 기한이 지나는 즉시 알린다.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: pr-deadline-escalation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Notify overdue pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          NOW=$(date -u +%s)
          TODAY=$(TZ=Asia/Seoul date +%F)

          gh pr list \
            --base develop \
            --state open \
            --limit 100 \
            --json number,title,createdAt,labels,reviewRequests,reviewDecision,isDraft \
            > prs.json

          # 초안이 아니고 승인 대기 상태인 PR만 대상으로 한다.
          # 변경 요청을 받은 PR은 공이 작성자에게 넘어간 상태이므로 제외한다.
          jq -r '
            ({"D-0":12,"D-1":24,"D-3":72,"D-5":120}) as $limits
            | .[]
            | select(.isDraft | not)
            | select(.reviewDecision == "REVIEW_REQUIRED")
            | . as $pr
            | ([.labels[].name] | map(select($limits[.] != null)) | sort_by($limits[.]) | first) as $deadline
            | select($deadline != null)
            | [
                $pr.number,
                $deadline,
                $limits[$deadline],
                $pr.createdAt,
                ([$pr.reviewRequests[] | (.login // .slug // empty)] | join(" "))
              ]
            | @tsv
          ' prs.json > targets.tsv

          while IFS=$'\t' read -r NUMBER LABEL LIMIT CREATED REVIEWERS; do
            [ -n "${NUMBER:-}" ] || continue

            CREATED_TS=$(date -u -d "$CREATED" +%s)
            ELAPSED=$(( (NOW - CREATED_TS) / 3600 ))

            if [ "$ELAPSED" -lt "$LIMIT" ]; then
              continue
            fi

            MARKER="<!-- deadline-escalation:${TODAY} -->"

            # 같은 PR에 하루 한 번만 알린다.
            if gh pr view "$NUMBER" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
              echo "PR #${NUMBER} 은 오늘 이미 알림을 보냈다."
              continue
            fi

            MENTION=""
            for REVIEWER in $REVIEWERS; do
              MENTION="${MENTION}@${REVIEWER} "
            done
            if [ -z "$MENTION" ]; then
              MENTION="리뷰어가 지정되지 않았습니다."
            fi

            {
              echo "$MARKER"
              echo
              echo "처리 기한을 넘겼습니다. 라벨은 ${LABEL}(${LIMIT}시간)이고 PR 생성 후 ${ELAPSED}시간이 지났으며 승인은 아직 없습니다."
              echo
              echo "${MENTION}리뷰를 부탁드립니다."
              echo
              echo "기한이 지나도 승인 없이 머지되지는 않습니다. 실제로 즉시 반영이 필요하다면 \`emergency\` 라벨을 붙인 뒤 저장소 관리자가 이 PR에 \`긴급 사유:\`로 시작하는 코멘트를 남겨 주세요. 필수 체크가 통과하면 승인 없이 머지되고 사후 리뷰 이슈가 자동으로 생성됩니다."
            } > comment.md

            gh pr comment "$NUMBER" --body-file comment.md
            echo "PR #${NUMBER} (${LABEL}, ${ELAPSED}시간 경과) 알림을 보냈다."
          done < targets.tsv
